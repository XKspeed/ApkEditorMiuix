name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # 手动触发（temp-main 等分支走这里）

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=3g"
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # R8 构建（不签名）→ 产出 app-release-unsigned.apk
      - name: Build Release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

      # 长期密钥从 Secrets 解出：保证每次构建签名一致 → 用户可直接覆盖升级
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.p12
          test -s keystore/release.p12
          echo "keystore bytes: $(wc -c < keystore/release.p12)"

      # 只打 V2 签名（V1/V3/V4 全关）
      - name: Sign with V2 scheme only
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          test -n "$UNSIGNED"
          echo "unsigned: $UNSIGNED"
          OUT=app/build/outputs/apk/release/app-release-v2signed.apk
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" aligned.apk
          "$APKSIGNER" sign \
            --ks keystore/release.p12 \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$OUT" aligned.apk
          echo "signed -> $OUT"

      # 校验：V2 必须为 true，V1/V3 必须为 false
      - name: Verify V2-only signature
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release-v2signed.apk
          test -f "$APK"
          echo "=== apksigner verify ==="
          "$APKSIGNER" verify --verbose "$APK" | tee verify.txt
          echo "=== assertions ==="
          grep -i 'Verified using v1 scheme' verify.txt | grep -qi true && { echo "::error::V1 unexpectedly enabled"; exit 1; } || echo "V1 = false ✓"
          grep -i 'Verified using v2 scheme' verify.txt | grep -qi true || { echo "::error::V2 missing"; exit 1; }
          echo "V2 = true ✓"
          grep -i 'Verified using v3 scheme' verify.txt | grep -qi true && { echo "::error::V3 unexpectedly enabled"; exit 1; } || echo "V3 = false ✓"
          echo "=== signer cert ==="
          "$APKSIGNER" verify --print-certs "$APK" | sed -n '1,12p'

      - name: Upload Release APK (V2-signed)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/app-release-v2signed.apk
